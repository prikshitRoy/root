name: Release Cross-Platform Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: windows-x64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_name: macos-arm64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev dpkg-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run unit & integration tests
        run: cargo test

      - name: Build portable app and Setup Wizard installer
        run: cargo build --release --bins

      - name: Upload portable binary & standalone Setup Wizard
        uses: actions/upload-artifact@v4
        with:
          name: root-${{ matrix.platform_name }}
          path: |
            target/release/root${{ matrix.ext }}
            target/release/root-installer${{ matrix.ext }}
            