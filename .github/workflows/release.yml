name: Release Cross-Platform Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: windows-x64
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_name: macos-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_name: macos-x64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev dpkg-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run unit & integration tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test

      - name: Build portable app and Setup Wizard installer
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package Windows executables & installer (.exe, .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $relDir = "target/${{ matrix.target }}/release"
          Copy-Item "$relDir/root-installer.exe" "dist/root-setup-${{ matrix.platform_name }}.exe"
          Copy-Item "$relDir/root.exe" "dist/root-${{ matrix.platform_name }}.exe"
          Compress-Archive -Path "$relDir/root.exe", "$relDir/root-installer.exe", "README.md" -DestinationPath "dist/root-${{ matrix.platform_name }}.zip"

      - name: Package macOS application bundle & disk image (.dmg, .app.zip, .tar.gz)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          REL_DIR="target/${{ matrix.target }}/release"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          chmod +x "$REL_DIR/root" "$REL_DIR/root-installer"

          APP_DIR="build_app/root.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$REL_DIR/root" "$APP_DIR/Contents/MacOS/root"
          cp "$REL_DIR/root-installer" "$APP_DIR/Contents/MacOS/root-installer"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleName</key><string>root</string>' \
            '    <key>CFBundleDisplayName</key><string>root</string>' \
            '    <key>CFBundleIdentifier</key><string>com.root.desktop</string>' \
            "    <key>CFBundleVersion</key><string>${VERSION}</string>" \
            "    <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            '    <key>CFBundlePackageType</key><string>APPL</string>' \
            '    <key>CFBundleExecutable</key><string>root</string>' \
            '    <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' > "$APP_DIR/Contents/Info.plist"

          (cd build_app && zip -r "../dist/root-${{ matrix.platform_name }}.app.zip" root.app)

          mkdir -p dmg_staging
          cp -R "$APP_DIR" dmg_staging/
          cp "$REL_DIR/root-installer" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "root" -srcfolder dmg_staging -ov -format UDZO "dist/root-${{ matrix.platform_name }}.dmg"

          tar -czvf "dist/root-${{ matrix.platform_name }}.tar.gz" -C "$REL_DIR" root root-installer

      - name: Package Linux installers & portable archives (.deb, Setup Wizard, .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          REL_DIR="target/${{ matrix.target }}/release"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          chmod +x "$REL_DIR/root" "$REL_DIR/root-installer"

          cp "$REL_DIR/root-installer" "dist/root-installer-${{ matrix.platform_name }}"
          tar -czvf "dist/root-${{ matrix.platform_name }}.tar.gz" -C "$REL_DIR" root root-installer

          DEB_DIR="deb_staging"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/bin" "$DEB_DIR/usr/share/applications"
          cp "$REL_DIR/root" "$DEB_DIR/usr/bin/root"
          cp "$REL_DIR/root-installer" "$DEB_DIR/usr/bin/root-installer"
          chmod 0755 "$DEB_DIR/usr/bin/root" "$DEB_DIR/usr/bin/root-installer"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=root' \
            'Comment=Inspect software project trees and export source code to Markdown' \
            'Exec=root' \
            'Terminal=false' \
            'Categories=Development;Utility;' > "$DEB_DIR/usr/share/applications/root.desktop"

          printf '%s\n' \
            'Package: root' \
            "Version: ${VERSION}" \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Depends: libgtk-3-0, libxcb1, libxcb-render0, libxcb-shape0, libxcb-xfixes0, libxkbcommon0' \
            'Maintainer: root contributors' \
            'Description: Cross-platform desktop app to inspect project trees and export code to Markdown' > "$DEB_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$DEB_DIR" "dist/root-linux-amd64.deb"

      - name: Upload OS release assets
        uses: actions/upload-artifact@v4
        with:
          name: root-${{ matrix.platform_name }}
          path: dist/*

  publish-release:
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release_staging
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_staging/*